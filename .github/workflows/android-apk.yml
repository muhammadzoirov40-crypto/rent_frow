name: android-apk

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
      - '!mobile/RentHub.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install deps
        working-directory: mobile
        run: npm ci

      - name: Prebuild android
        working-directory: mobile
        run: npx expo prebuild -p android --no-install

      - name: Build APK
        working-directory: mobile
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/RentHub.apk
          ls -lh mobile/RentHub.apk

      - name: Commit APK to repo
        continue-on-error: true
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mobile/RentHub.apk
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: RentHub Android APK"
            git push origin HEAD:master
          fi

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1             && gh release upload apk-latest mobile/RentHub.apk --clobber --repo "$GITHUB_REPOSITORY"             || gh release create apk-latest mobile/RentHub.apk --repo "$GITHUB_REPOSITORY"                  --title "RentHub APK" --notes "Android APK build" --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RentHub-apk
          path: mobile/RentHub.apk
