<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Ambient category field: the six glyphs that stand for what RentHub
       rents (house, market, car, phone, key, tools) plus two wave lines.
       Used as a CSS mask (index.css body::after) — strokes are opaque so the
       theme's tint shows through; fills must stay empty. -->
  <g fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- Wave lines across the middle -->
    <path stroke-width="2" d="M-20 430 C 180 404, 340 456, 560 434 S 940 394, 1160 428 S 1460 458, 1620 430" />
    <path stroke-width="2" d="M-20 470 C 220 448, 400 492, 640 469 S 1020 434, 1240 464 S 1500 490, 1620 467" />

    <!-- House (Молият) -->
    <g transform="translate(345 262) scale(2.3)">
      <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
      <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
    </g>

    <!-- Shopping cart (Хариду фурӯш) -->
    <g transform="translate(620 225) scale(2.3)">
      <path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18" />
      <path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25" />
      <circle cx="18" cy="20" r="2" />
      <circle cx="8" cy="20" r="2" />
    </g>

    <!-- Car (Наклиёт) -->
    <g transform="translate(1055 280) scale(2.3)">
      <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
      <circle cx="7" cy="17" r="2" />
      <path d="M9 17h6" />
      <circle cx="17" cy="17" r="2" />
    </g>

    <!-- Smartphone (Электроника) -->
    <g transform="translate(350 552) scale(2.3)">
      <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
      <path d="M12 18h.01" />
    </g>

    <!-- Key (Калиди иҷора) -->
    <g transform="translate(620 585) scale(2.3)">
      <path d="m2 21 9.6-9.6" />
      <path d="m7.5 15.5 2.3 2.3a1 1 0 0 1 0 1.4l-2.1 2.1a1 1 0 0 1-1.4 0L4 19" />
      <circle cx="15.5" cy="7.5" r="5.5" />
    </g>

    <!-- Wrench (Асбобҳо) -->
    <g transform="translate(1060 525) scale(2.3)">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" />
    </g>

  </g>
</svg>
