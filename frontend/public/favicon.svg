    <path d="M 43 24 h 1 M 56 17 h 1 M 56 22 h 1 M 69 26 h 1" stroke="#FFFFFF" stroke-width="2.5" />
  </g>

  <!-- Left Vertical Pillar -->
  <path d="M 28 32 L 28 86" stroke="url(#favP)" stroke-width="12" stroke-linecap="round" />

  <!-- Upper Bowl & Keyhole arch -->
