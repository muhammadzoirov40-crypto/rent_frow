<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="favBadgeGrad" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#1C6B3B"/>
      <stop offset="45%" stop-color="#11502B"/>
      <stop offset="100%" stop-color="#06301A"/>
    </linearGradient>
    <linearGradient id="favOrbitGrad" gradientUnits="userSpaceOnUse" x1="60" y1="24" x2="60" y2="104">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="45%" stop-color="#D9F99D"/>
      <stop offset="78%" stop-color="#F7FEE7"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- sparkles above the badge -->
  <path d="M 0 -1 C 0.09 -0.33 0.33 -0.09 1 0 C 0.33 0.09 0.09 0.33 0 1 C -0.09 0.33 -0.33 0.09 -1 0 C -0.33 -0.09 -0.09 -0.33 0 -1 Z" transform="translate(30 16) scale(7.5)" fill="#A3E635"/>
  <path d="M 0 -1 C 0.09 -0.33 0.33 -0.09 1 0 C 0.33 0.09 0.09 0.33 0 1 C -0.09 0.33 -0.33 0.09 -1 0 C -0.33 -0.09 -0.09 -0.33 0 -1 Z" transform="translate(63 7) scale(4.5)" fill="#A3E635"/>
  <path d="M 0 -1 C 0.09 -0.33 0.33 -0.09 1 0 C 0.33 0.09 0.09 0.33 0 1 C -0.09 0.33 -0.33 0.09 -1 0 C -0.33 -0.09 -0.09 -0.33 0 -1 Z" transform="translate(95 19) scale(3.5)" fill="#A3E635"/>

  <!-- orbit: behind the badge -->
  <ellipse cx="60" cy="64" rx="57" ry="37" transform="rotate(-16 60 64)" stroke="url(#favOrbitGrad)" stroke-width="5" fill="none"/>

  <!-- dark-green badge with the white RH monogram -->
  <circle cx="60" cy="64" r="38" fill="url(#favBadgeGrad)"/>
  <text x="60" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-1.5" fill="#FFFFFF">RH</text>

  <!-- orbit: in front of the badge at the bottom (white crescent) -->
  <path d="M 3 64 A 57 37 0 0 0 117 64" transform="rotate(-16 60 64)" stroke="url(#favOrbitGrad)" stroke-width="5" fill="none"/>
</svg>
