<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2433" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>
    <linearGradient id="favR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA14A" />
    </linearGradient>
  </defs>

  <!-- Rounded Tile with Border -->
  <rect width="64" height="64" rx="18" fill="url(#favBg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Subtle Top Highlight -->
  <path d="M 8 18 Q 32 8 56 18" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" fill="none" />

  <!-- Modern Streamlined 'R' -->
  <path d="M 19 14 V 50" stroke="url(#favR)" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 19 14 H 36 C 46 14, 46 32, 36 32 H 19" stroke="url(#favR)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 31 32 L 45 50" stroke="#FF6B35" stroke-width="6.5" stroke-linecap="round" />

  <!-- Center Dot -->
  <circle cx="29" cy="23" r="2.5" fill="#FFFFFF" />
</svg>
