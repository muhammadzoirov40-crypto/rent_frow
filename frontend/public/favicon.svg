<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Blue gradient matching exact image -->
    <linearGradient id="favRBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2FF"/>
      <stop offset="50%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0038FF"/>
    </linearGradient>
  </defs>

  <!-- Solid R Monogram Body with embedded house shape -->
  <!-- Main R Body -->
  <path
    d="M 16 12 
       C 16 8, 20 5, 26 5 
       L 58 5 
       C 78 5, 88 16, 88 34 
       C 88 50, 76 60, 58 64 
       L 88 95 
       L 68 95 
       L 44 68 
       L 44 95 
       L 16 95 
       Z"
    fill="url(#favRBlue)"
  />

  <!-- Embedded White House Roof cutting inside R -->
  <path
    d="M 16 42 
       L 48 16 
       L 76 34 
       L 70 42 
       L 48 24 
       L 26 44 
       Z"
    fill="#FFFFFF"
  />

  <!-- White house arch inside -->
  <path
    d="M 32 44 
       L 48 30 
       L 64 42 
       L 64 64 
       L 32 64 
       Z"
    fill="#FFFFFF"
  />

  <!-- 4 Blue Windows -->
  <g fill="#0066FF">
    <rect x="38" y="44" width="8" height="8" rx="2"/>
    <rect x="50" y="44" width="8" height="8" rx="2"/>
    <rect x="38" y="55" width="8" height="8" rx="2"/>
    <rect x="50" y="55" width="8" height="8" rx="2"/>
  </g>
</svg>
