<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Royal Sapphire Gradient -->
    <linearGradient id="logoSvgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C9BFF"/>
      <stop offset="55%" stop-color="#2E63F5"/>
      <stop offset="100%" stop-color="#143DB8"/>
    </linearGradient>
    <linearGradient id="logoSvgNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C93FF"/>
      <stop offset="100%" stop-color="#2E63F5"/>
    </linearGradient>
  </defs>

  <!-- 100% Transparent Emblem with Compound Path Cutout -->
  <g transform="translate(10, 8)">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M 46 6
         C 50 6, 53 8, 56 11
         L 76 30
         C 83 37, 86 46, 83 55
         C 79 66, 68 72, 56 74
         L 78 88
         C 81 90, 79 94, 74 94
         L 59 94
         C 55 94, 51 91, 48 87
         L 32 67
         L 32 88
         C 32 92, 29 94, 25 94
         L 17 94
         C 13 94, 11 92, 11 88
         L 11 12
         C 11 8, 14 6, 18 6
         Z
         M 27 20
         L 48 8
         C 50 7, 52 7, 54 8
         L 71 23
         C 76 28, 76 37, 71 43
         C 67 48, 60 50, 52 50
         L 27 50
         Z"
      fill="url(#logoSvgGrad)"
    />

    <!-- Hub Node -->
    <circle cx="50" cy="30" r="7" fill="url(#logoSvgNode)"/>
    <path d="M 50 37 V 45" stroke="url(#logoSvgNode)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(108, 62)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="50" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="#0B132B">Rent</tspan><tspan fill="#2E63F5">Hub</tspan>
    </text>
  </g>
</svg>
