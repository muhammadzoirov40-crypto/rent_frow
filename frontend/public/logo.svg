<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <!-- Deep Navy to Modern Electric Blue Gradient for Symbol -->
    <linearGradient id="rhUnifiedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2FF"/>
      <stop offset="55%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0044CC"/>
    </linearGradient>

    <!-- Subtle connection node accent -->
    <linearGradient id="rhAccentPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>

  <!-- ==================== UNIFIED SYMBOL: HOUSE + PIN + RENTAL LOOP + HUB ==================== -->
  <g transform="translate(10, 8)">
    
    <!-- Outer Location Pin + Continuous Rental Loop forming the Monogram R/House Profile -->
    <!-- 
      Geometrical structure:
      - Pointed arch roof top (House/Dwelling)
      - Curved dynamic pin contour (Location/Finding a place)
      - Integrated continuous loop (Renter <-> Owner connection & Hub exchange)
    -->
    <path
      d="M 42 6
         C 46 6, 49 8, 52 11
         L 72 30
         C 79 37, 82 46, 79 55
         C 75 66, 64 72, 52 74
         L 74 88
         C 77 90, 75 94, 70 94
         L 55 94
         C 51 94, 47 91, 44 87
         L 28 67
         L 28 88
         C 28 92, 25 94, 21 94
         L 13 94
         C 9 94, 7 92, 7 88
         L 7 12
         C 7 8, 10 6, 14 6
         Z"
      fill="url(#rhUnifiedGrad)"
    />

    <!-- Negative Space: The Portal (Interior House Silhouette + Location Pin Inversion) -->
    <path
      d="M 23 20
         L 44 8
         C 46 7, 48 7, 50 8
         L 67 23
         C 72 28, 72 37, 67 43
         C 63 48, 56 50, 48 50
         L 23 50
         Z"
      fill="#FFFFFF"
    />

    <!-- Central Node: The Marketplace Hub & Owner/Renter Handshake Core -->
    <circle cx="46" cy="30" r="6.5" fill="url(#rhAccentPulse)"/>
    <path d="M 46 36.5 V 45" stroke="url(#rhAccentPulse)" stroke-width="3" stroke-linecap="round"/>

    <!-- Dynamic Flow Arch on the stem (Expressing continuous rental lifecycle) -->
    <path
      d="M 7 54
         C 12 50, 18 50, 23 54"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.8"
    />

  </g>

  <!-- ==================== TYPOGRAPHY: BALANCED & REFINED GEOMETRIC SANS ==================== -->
  <g transform="translate(108, 62)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="50" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="#0B132B">Rent</tspan><tspan fill="#0066FF">Hub</tspan>
    </text>
  </g>
</svg>
