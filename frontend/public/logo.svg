<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#FF5216" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (x: 15 to 115) -->
  <g transform="translate(15, 15)">
    <!-- Rounded Container / App Icon Tile -->
    <rect width="100" height="100" rx="24" fill="url(#iconBgGrad)" stroke="#334155" stroke-width="1.5" />
    
    <!-- City Skyline Silhouette Backdrop inside R -->
    <path d="M 50 26 L 50 18 L 60 18 L 60 28 L 68 28 L 68 36" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <path d="M 54 22 h 2 M 64 32 h 2" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Main Stylized Monogram "R" Body -->
    <!-- Left vertical stem -->
    <path d="M 32 30 L 32 78" stroke="url(#primaryGrad)" stroke-width="9" stroke-linecap="round" />
    
    <!-- Keyhole Arch & Upper Bowl of R -->
    <path d="M 32 30 C 32 20, 68 20, 68 45 C 68 58, 48 58, 38 58" fill="none" stroke="url(#primaryGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dynamic Diagonal Leg of R (Turning into Key Tip / Arrow) -->
    <path d="M 51 53 L 73 78" stroke="url(#accentGrad)" stroke-width="9" stroke-linecap="round" />

    <!-- Keyhole Center Core inside R -->
    <circle cx="49" cy="42" r="5" fill="#FFFFFF" />
    <polygon points="47,43 51,43 52,51 46,51" fill="#FFFFFF" />
  </g>

  <!-- Typography: RentHub Text -->
  <g transform="translate(135, 75)">
    <!-- "Rent" in Bold Clean Font -->
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Rent<tspan fill="url(#primaryGrad)">Hub</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text y="25" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="2.8" text-transform="uppercase">
      АРЕНДА И ПРОКАТ
    </text>
  </g>
</svg>
