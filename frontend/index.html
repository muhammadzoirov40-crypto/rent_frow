<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentHub — Аренда оборудования и недвижимости</title>
    <meta name="description" content="RentHub — платформа аренды: недвижимость, транспорт, оборудование и услуги." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html.light body { background-color: #f8fafc; color: #1e293b; }
      html.dark body { background-color: #020617; color: #e2e8f0; }
    </style>
    <script>
      // Apply saved theme color before first paint (avoids flash of default accent)
      try {
        var a = localStorage.getItem('accent');
        if (a && a !== 'original') document.documentElement.setAttribute('data-accent', a);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
