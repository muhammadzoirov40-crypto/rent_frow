[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = .
# No URL here on purpose: alembic/env.py sets sqlalchemy.url from
# app settings (DATABASE_URL), the same database the server uses.
# A hardcoded url in this file is what made `alembic upgrade` migrate a file
# nobody was reading. Override per-run with ALEMBIC_DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
